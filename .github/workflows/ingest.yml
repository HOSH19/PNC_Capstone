name: ingest

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"   # 00/06/12/18 UTC; watermarks make extra runs no-ops

env:
  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
  SEC_USER_AGENT_EMAIL: ${{ secrets.SEC_USER_AGENT_EMAIL }}

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Seed banks from CSV
        run: python -m pipeline.seed_banks

  # One matrix leg per poller. Isolation is structural: pollers run only if
  # seeding succeeded (needs: seed), and fail-fast: false means one failing
  # source never blocks or cancels the others.
  poll:
    needs: seed
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # New pollers: add the module name here — one line. RUNBOOK.md §6.
        #
        # poll_gkg replaced poll_gdelt on 2026-08-14. The DOC API limits on
        # cumulative volume, not rate -- 8 s, 25 s and 60 s all 429'd alike --
        # and its error body tells high-traffic users to change datasets, so
        # no spacing was going to fix it. poll_gkg reads the same BigQuery
        # tables the backfill uses, which also puts live and historical rows
        # on one corpus. poll_gdelt.py stays in the tree: backfill_gkg still
        # imports its title-hash helper.
        module: [poll_gkg, poll_edgar, poll_fdic_enforcement, poll_fed_enforcement, poll_agency_rss, poll_occ_enforcement]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Only poll_gkg needs Google credentials. gcloud ships on the runner
      # image, so this activates the service account rather than installing
      # anything; the key never touches the working tree.
      - name: Authenticate to BigQuery
        if: matrix.module == 'poll_gkg'
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          KEY="$(mktemp)"
          printf '%s' "$GCP_SA_KEY" > "$KEY"
          gcloud auth activate-service-account --key-file="$KEY" --quiet
          rm -f "$KEY"

      - name: Run ${{ matrix.module }}
        env:
          BIGQUERY_PROJECT: ${{ secrets.BIGQUERY_PROJECT }}
        run: python -m pipeline.${{ matrix.module }}
