name: ingest

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"   # 00/06/12/18 UTC; watermarks make extra runs no-ops

env:
  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
  SEC_USER_AGENT_EMAIL: ${{ secrets.SEC_USER_AGENT_EMAIL }}

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Seed banks from CSV
        run: python -m pipeline.seed_banks

  # One matrix leg per poller. Isolation is structural: pollers run only if
  # seeding succeeded (needs: seed), and fail-fast: false means one failing
  # source never blocks or cancels the others.
  poll:
    needs: seed
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # New pollers: add the module name here — one line. RUNBOOK.md §6.
        #
        # poll_gdelt was paused 2026-08-12 so the backfill could have GDELT
        # to itself; the backfill moved to BigQuery on 2026-08-14, so the
        # reason is gone and it is back. It may still 429 -- the DOC API has
        # been refusing our volume since ~2026-08-01 at every spacing tried --
        # but the poller is ~104 requests a run against the backfill's ~3,000,
        # and live collection has been dead for two weeks either way.
        module: [poll_gdelt, poll_edgar, poll_fdic_enforcement, poll_fed_enforcement, poll_agency_rss, poll_occ_enforcement]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ${{ matrix.module }}
        run: python -m pipeline.${{ matrix.module }}
