name: ingest

on:
  workflow_dispatch:

env:
  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
  SEC_USER_AGENT_EMAIL: ${{ secrets.SEC_USER_AGENT_EMAIL }}

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Seed banks from CSV
        run: python -m pipeline.seed_banks

  # One matrix leg per poller. Isolation is structural: pollers run only if
  # seeding succeeded (needs: seed), and fail-fast: false means one failing
  # source never blocks or cancels the others.
  poll:
    needs: seed
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # New pollers: add the module name here — one line. RUNBOOK.md §6.
        module: [poll_gdelt, poll_edgar]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ${{ matrix.module }}
        run: python -m pipeline.${{ matrix.module }}
