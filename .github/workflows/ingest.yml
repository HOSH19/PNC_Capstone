name: ingest

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"   # 00/06/12/18 UTC; watermarks make extra runs no-ops

env:
  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
  SEC_USER_AGENT_EMAIL: ${{ secrets.SEC_USER_AGENT_EMAIL }}

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Seed banks from CSV
        run: python -m pipeline.seed_banks

  # One matrix leg per poller. Isolation is structural: pollers run only if
  # seeding succeeded (needs: seed), and fail-fast: false means one failing
  # source never blocks or cancels the others.
  poll:
    needs: seed
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # New pollers: add the module name here — one line. RUNBOOK.md §6.
        #
        # ⚠️ poll_gdelt is PAUSED as of 2026-08-12, and must be put back.
        #
        # Why: the 2020-2024 backfill needs GDELT to itself. The two competing
        # produced 429s on both, and nothing consumes live GDELT yet (no
        # serving, no dashboard), so the backfill goes first.
        #
        # RESTORE by putting poll_gdelt back in the list below, as soon as the
        # backfill stops reporting `incomplete`. This is not free to forget:
        # the poller resumes from its own watermark, so a short pause is
        # caught up automatically, but GDELT's artlist API only serves a
        # limited recent window — a pause left running for weeks loses those
        # articles permanently, and nothing here will warn you.
        module: [poll_edgar, poll_fdic_enforcement, poll_fed_enforcement, poll_agency_rss]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ${{ matrix.module }}
        run: python -m pipeline.${{ matrix.module }}
